# Blueprint do Render: 3 web services, 1 Postgres e 1 Key Value, todos no plano free.
# Instrucoes em deploy/INSTRUCOES.md. Os campos `sync: false` sao preenchidos no painel e
# nunca vao para o repositorio.
# Atencao: o Postgres gratuito expira 30 dias apos a criacao.
# As URLs entre servicos sao fixas: a primeira sincronizacao ficou presa antes de criar o
# worker, que dependia da RENDER_EXTERNAL_URL de outro servico. Ao recria-los, atualize aqui.

databases:
  - name: c3a2-vetorial
    plan: free
    region: virginia
    postgresMajorVersion: "17"
    ipAllowList: []

envVarGroups:
  - name: c3a2-interno
    envVars:
      - key: TOKEN_INTERNO
        generateValue: true

  # tempo-limite e resiliencia na nuvem: cobrem o cold start (~1 min) dos servicos gratuitos
  - name: c3a2-resiliencia
    envVars:
      - key: TIMEOUT_INFERENCIA
        value: "90"
      - key: PRAZO_INFERENCIA
        value: "120"
      - key: RETENTATIVAS
        value: "3"
      - key: BACKOFF_BASE
        value: "1"
      - key: LIMITE_FALHAS
        value: "3"
      - key: ESPERA_DISJUNTOR
        value: "20"

services:
  - type: keyvalue
    name: c3a2-fila
    plan: free
    region: virginia
    ipAllowList: []
    maxmemoryPolicy: noeviction

  - type: web
    name: c3a2-inferencia
    runtime: docker
    plan: free
    region: virginia
    dockerContext: .
    dockerfilePath: ./inferencia/Dockerfile
    healthCheckPath: /saude
    buildFilter:
      paths: [inferencia/**, comum/**, vetorial/**, pyproject.toml, uv.lock]
      ignoredPaths: ["**/*.md"]
    envVars:
      - fromGroup: c3a2-interno
      - key: DATABASE_URL
        fromDatabase: {name: c3a2-vetorial, property: connectionString}
      - key: OTEL_SERVICE_NAME
        value: inferencia
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        value: https://api.honeycomb.io
      - key: OTEL_EXPORTER_OTLP_HEADERS
        sync: false

  - type: web
    name: c3a2-worker
    runtime: docker
    plan: free
    region: virginia
    dockerContext: .
    dockerfilePath: ./worker/Dockerfile
    healthCheckPath: /saude
    buildFilter:
      paths: [worker/**, comum/**, vetorial/**, pyproject.toml, uv.lock]
      ignoredPaths: ["**/*.md"]
    envVars:
      - fromGroup: c3a2-interno
      - key: DATABASE_URL
        fromDatabase: {name: c3a2-vetorial, property: connectionString}
      - key: REDIS_URL
        fromService: {type: keyvalue, name: c3a2-fila, property: connectionString}
      - key: URL_INFERENCIA
        value: https://c3a2-inferencia-iwrc.onrender.com
      - fromGroup: c3a2-resiliencia
      - key: MAX_TENTATIVAS
        value: "3"
      - key: TAREFA_IDADE_MAXIMA
        value: "900"
      - key: RETENCAO_DIAS
        value: "30"
      - key: DLQ_RETENCAO_DIAS
        value: "7"
      - key: OTEL_SERVICE_NAME
        value: worker
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        value: https://api.honeycomb.io
      - key: OTEL_EXPORTER_OTLP_HEADERS
        sync: false

  - type: web
    name: c3a2-gateway
    runtime: docker
    plan: free
    region: virginia
    dockerContext: .
    dockerfilePath: ./gateway/Dockerfile
    healthCheckPath: /saude
    buildFilter:
      paths: [gateway/**, comum/**, pyproject.toml, uv.lock]
      ignoredPaths: ["**/*.md"]
    envVars:
      - fromGroup: c3a2-interno
      - key: JWT_SEGREDO
        generateValue: true
      - key: USUARIO_DEMO
        sync: false
      - key: SENHA_DEMO
        sync: false
      - key: REDIS_URL
        fromService: {type: keyvalue, name: c3a2-fila, property: connectionString}
      - key: URL_INFERENCIA
        value: https://c3a2-inferencia-iwrc.onrender.com
      - key: URL_WORKER
        value: https://c3a2-worker.onrender.com
      - fromGroup: c3a2-resiliencia
      - key: LIMITE_POR_MINUTO
        value: "60"
      - key: JWT_EXPIRA_MIN
        value: "60"
      - key: OTEL_SERVICE_NAME
        value: gateway
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        value: https://api.honeycomb.io
      - key: OTEL_EXPORTER_OTLP_HEADERS
        sync: false
